html,body{min-height:100vh;min-height:100dvh}
#app{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);box-sizing:border-box}
button[aria-label="Agregar gasto o ingreso"],button[aria-label="Ingresar los saldos actuales para el conteo"]{margin-top:env(safe-area-inset-top)!important;margin-right:env(safe-area-inset-right)!important}
#clave-gate{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}
#clave-gate form{width:min(380px,100%);box-sizing:border-box;padding:22px;border-radius:24px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);box-shadow:0 18px 50px rgba(0,0,0,.14);color:#1D1D1F}
#clave-gate h2{margin:0 0 6px;font-size:20px}#clave-gate p{margin:0 0 14px;font-size:13px;opacity:.7}
#clave-gate input{width:100%;box-sizing:border-box;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.55);color:inherit;outline:none}
#clave-gate button{margin-top:12px;width:100%;font-size:16px;font-weight:600;padding:12px;border:none;border-radius:14px;background:#26A699;color:#fff}
#clave-gate .err{color:#E5484D;font-size:13px;min-height:16px;margin-top:8px}
@media (prefers-color-scheme: dark){#clave-gate form{background:rgba(40,40,44,.55);border-color:rgba(255,255,255,.18);color:#F5F5F7}#clave-gate input{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14)}}
html,body{background:#070707;color:#F2F2F2}
button[aria-label="Agregar gasto o ingreso"],button[aria-label="Ingresar los saldos actuales para el conteo"]{display:none!important}
button[aria-label="Matar a Cookie"]{position:fixed!important;top:calc(8px + env(safe-area-inset-top))!important;right:calc(10px + env(safe-area-inset-right))!important;width:36px!important;height:36px!important;margin:0!important;padding:0!important;border-radius:999px!important;display:flex!important;align-items:center!important;justify-content:center!important;font-size:15px!important;line-height:1!important;z-index:60!important;overflow:hidden!important}
[aria-label^="Cookie ("]{bottom:calc(84px + env(safe-area-inset-bottom, 0px))!important}
.pato-txt{display:none}
@keyframes ffRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ffIn{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}
.ff-card{transition:transform .18s cubic-bezier(.22,1,.36,1),box-shadow .18s}
.ff-card:active{transform:scale(.975)}

#app{padding-bottom:calc(90px + env(safe-area-inset-bottom))!important}
@keyframes pilaIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
