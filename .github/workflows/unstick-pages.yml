name: Unstick Pages deployment
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unstick-pages.yml
permissions:
  pages: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/pages/deployments/1195d7d238c435aacdd70666d94583764db31207/cancel"
          gh api "/repos/${{ github.repository }}/pages/deployments/1195d7d238c435aacdd70666d94583764db31207"
